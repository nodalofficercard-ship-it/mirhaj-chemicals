<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mirhaj Chemicals</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1a120c; }
    .hero { position: relative; min-height: 100vh; overflow: hidden; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
    .hero img.on { opacity: 1; }
  </style>
</head>
<body>
  <section class="hero">
    <img class="on" src="https://cdn.jsdelivr.net/gh/nodalofficercard-ship-it/mirhaj-chemicals@gh-pages/lettuce.jpg" alt="Lettuce field" />
    <img src="https://cdn.jsdelivr.net/gh/nodalofficercard-ship-it/mirhaj-chemicals@gh-pages/tomatoes.jpg" alt="Tomatoes" />
  </section>
  <script>
    const photos = [...document.querySelectorAll(".hero img")];
    let i = 0;
    setInterval(() => {
      i = (i + 1) % photos.length;
      photos.forEach((p, idx) => p.classList.toggle("on", idx === i));
    }, 5600);
  </script>
</body>
</html>
